services:
  # ============================================
  # API Principal
  # ============================================
  api:
    build: .
    container_name: data-hub-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Worker Celery (tarefas assíncronas)
  # ============================================
  worker:
    build: .
    container_name: data-hub-worker
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  # ============================================
  # Redis (broker do Celery + cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: data-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

