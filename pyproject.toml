[project]
name = "data-hub"
version = "0.1.0"
description = "Multi-database hub with intent-based messaging (Regex + LLM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "aiomysql>=0.2.0",
    "pymongo>=4.7",
    "motor>=3.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "litellm>=1.40",
    "python-telegram-bot>=21.0",
    "typer>=0.12",
    "rich>=13.0",
    "alembic>=1.13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
hub = "src.cli.hub_cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
